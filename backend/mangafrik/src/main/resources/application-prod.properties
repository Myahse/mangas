## Production — URLs publiques MangAfriq.com (https://mangafriq.com)
## À activer uniquement sur l’hébergement : SPRING_PROFILES_ACTIVE=prod (souvent postgres,prod).
## En développement local, ne pas inclure « prod » : le fichier application.properties garde localhost.
##
## URLs HTTPS en minuscules (RFC). Réglages typiques :
## - Front et API derrière le même hôte (reverse proxy /api/v1 → backend) :
##     APP_PUBLIC_BASE_URL / APP_PUBLIC_API_BASE_URL = https://mangafriq.com
## - API sur sous-domaine :
##     APP_PUBLIC_API_BASE_URL=https://api.mangafriq.com

app.public.base-url=${APP_PUBLIC_BASE_URL:https://mangafriq.com}
app.public.api-base-url=${APP_PUBLIC_API_BASE_URL:https://mangafriq.com}
