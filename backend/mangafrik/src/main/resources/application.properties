spring.application.name=mangafriq
server.port=${PORT:8088}
server.address=0.0.0.0

# Flyway migrations (create/update app tables)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# Auth / JWT
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.require-secret=${APP_JWT_REQUIRE_SECRET:false}

# Realtime broker relay (RabbitMQ STOMP) for horizontal scaling
# - Enable by setting APP_REALTIME_RELAY_HOST and APP_REALTIME_RELAY_PORT (usually 61613)
# - RabbitMQ requires the "rabbitmq_stomp" plugin enabled.
app.realtime.broker.relay.host=${APP_REALTIME_RELAY_HOST:}
app.realtime.broker.relay.port=${APP_REALTIME_RELAY_PORT:}
app.realtime.broker.relay.login=${APP_REALTIME_RELAY_LOGIN:}
app.realtime.broker.relay.passcode=${APP_REALTIME_RELAY_PASSCODE:}
app.realtime.broker.relay.system-login=${APP_REALTIME_RELAY_SYSTEM_LOGIN:${APP_REALTIME_RELAY_LOGIN:}}
app.realtime.broker.relay.system-passcode=${APP_REALTIME_RELAY_SYSTEM_PASSCODE:${APP_REALTIME_RELAY_PASSCODE:}}

# Cloudflare R2 (S3-compatible) object storage
r2.endpoint=${R2_ENDPOINT:}
r2.accessKeyId=${R2_ACCESS_KEY_ID:}
r2.secretAccessKey=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}

# Render cold start / heavy classpath: allow opting into faster boot
spring.main.lazy-initialization=${SPRING_LAZY_INIT:false}
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.integration.jdbc.initialize-schema=never
spring.session.jdbc.initialize-schema=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.writer-with-default-pretty-printer=true

# Mail (copied from immo backend pattern)
# Configure these via environment variables or a local untracked override file.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

app.email.from=${APP_EMAIL_FROM:MangAfric <team@mangafric.com>}
app.email.subject.prefix=${APP_EMAIL_SUBJECT_PREFIX:[MangAfric]}
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.brevo.api-key=${BREVO_API_KEY:}
# Domaine public officiel : MangAfric.com (URLs HTTPS https://mangafric.com ; emails @mangafric.com).
# Local : sans profil « prod » ni variables APP_PUBLIC_*, tout reste sur localhost ci‑dessous.
# Production : SPRING_PROFILES_ACTIVE=…,prod et/ou APP_PUBLIC_BASE_URL / APP_PUBLIC_API_BASE_URL = https://mangafric.com (voir application-prod.properties).
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.public.api-base-url=${APP_PUBLIC_API_BASE_URL:http://localhost:8088}
# Absolute URL to PNG logo for HTML emails; empty = APP_PUBLIC_BASE_URL + /magafrik-logo.png
app.email.logo-url=${APP_EMAIL_LOGO_URL:}
# Used in creator emails (résumé modération / série publiée). Vide en local si vous ne fixez pas de port dédié.
app.creator-panel.url=${APP_CREATOR_PANEL_URL:}
app.auth.session.ttl-hours=${APP_AUTH_SESSION_TTL_HOURS:168}

# Coins feature toggles
app.coins.rewards.enabled=${APP_COINS_REWARDS_ENABLED:true}
app.coins.payments.enabled=${APP_COINS_PAYMENTS_ENABLED:false}

# Bootstrap first admin user (created only if email does not exist)
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:mangafric@gmail.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:MangAfric123}
app.bootstrap.admin.display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:MangAfric Admin}


spring.docker.compose.enabled=false


spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# Support chat attachments (multipart uploads)
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB


app.creator.logo.path=${APP_CREATOR_LOGO_PATH:../../creator-panel/public/creator-panel.png}

