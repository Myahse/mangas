spring.application.name=mangafrik
server.port=8082

# Disable Spring Boot Docker Compose integration by default (so the app can run
# even when Docker Desktop/daemon isn't available). Enable it explicitly via
# profile or environment variable when needed.
spring.docker.compose.enabled=false

# This project currently has R2DBC dependencies on the classpath but no database
# URL configured. Exclude R2DBC auto-config until a reactive database is added.
spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

