spring.application.name=mangafrik
server.port=${PORT:8088}
server.address=0.0.0.0

# Cloudflare R2 (S3-compatible) object storage
r2.endpoint=${R2_ENDPOINT:}
r2.accessKeyId=${R2_ACCESS_KEY_ID:}
r2.secretAccessKey=${R2_SECRET_ACCESS_KEY:}
r2.bucket=${R2_BUCKET:}

# Render cold start / heavy classpath: allow opting into faster boot
spring.main.lazy-initialization=${SPRING_LAZY_INIT:false}
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.integration.jdbc.initialize-schema=never
spring.session.jdbc.initialize-schema=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mail (copied from immo backend pattern)
# Configure these via environment variables or a local untracked override file.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

app.email.from=${APP_EMAIL_FROM:MangAfrik <noreply@mangafrik.com>}
app.email.subject.prefix=${APP_EMAIL_SUBJECT_PREFIX:[MangAfrik]}
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.public.base-url=${APP_PUBLIC_BASE_URL:https://mangafrik.com}

# Bootstrap first admin user (created only if email does not exist)
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:mangafrik@gmail.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:Mangafrik123}
app.bootstrap.admin.display-name=${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:MangAfrik Admin}

# Disable Spring Boot Docker Compose integration by default (so the app can run
# even when Docker Desktop/daemon isn't available). Enable it explicitly via
# profile or environment variable when needed.
spring.docker.compose.enabled=false

# This project currently has R2DBC dependencies on the classpath but no database
# URL configured. Exclude R2DBC auto-config until a reactive database is added.
spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,org.springframework.boot.batch.jdbc.autoconfigure.BatchJdbcAutoConfiguration,org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration

