## Enable with: SPRING_PROFILES_ACTIVE=postgres


# Keep only R2DBC excluded; enable JDBC/DataSource/JPA for this profile
spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration

# Neon Postgres
# - On Render/Neon, DATABASE_URL is often "postgresql://...".
# - We auto-convert it to "jdbc:postgresql://..." at boot.
spring.datasource.url=${spring.datasource.url:}

# Optional tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:10000}

# JPA (only used if you later add @Entity repositories)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}

