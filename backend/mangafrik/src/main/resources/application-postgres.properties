## Enable with: SPRING_PROFILES_ACTIVE=postgres


# Keep only R2DBC excluded; enable JDBC/DataSource/JPA for this profile
spring.autoconfigure.exclude=org.springframework.boot.r2dbc.autoconfigure.R2dbcAutoConfiguration,org.springframework.boot.data.r2dbc.autoconfigure.R2dbcDataAutoConfiguration

# Neon Postgres
# - Render/Neon may provide a URL as `postgresql://...` (non-JDBC).
# - We normalize env-provided URLs to `jdbc:postgresql://...` at boot.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:${DATABASE_URL:}}}

# Avoid "Failed to determine DatabaseDriver" during SQL init by explicitly
# providing the platform used for @@platform@@ placeholders.
spring.sql.init.platform=postgres

# Flyway migrations (create app tables)
spring.flyway.enabled=true


app.jwt.require-secret=true

# Spring Session JDBC script names use "postgresql".
spring.session.jdbc.platform=postgresql

# Initialize Spring Session tables in Postgres automatically 
spring.session.jdbc.initialize-schema=${SPRING_SESSION_JDBC_INIT_SCHEMA:never}

# Optional tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:10000}
#
# Prevent "Failed to validate connection ... (This connection has been closed.)"
# by retiring connections before the DB/proxy closes them.
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:60000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# JPA (only used if you later add @Entity repositories)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}

