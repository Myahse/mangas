<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{bannerHeadline}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fff7ed;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fff7ed;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(230,57,70,0.18);">
          <tr>
            <td style="padding:28px 28px 12px 28px;text-align:center;background-color:#ffffff;">
              <img src="{{logoUrl}}" alt="MangAfriq" width="200" height="auto" style="display:block;margin:0 auto;max-width:200px;height:auto;">
              <p style="margin:14px 0 0 0;font-size:13px;color:#64748b;letter-spacing:0.02em;">Mangas &amp; webtoons</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#e63946;padding:26px 28px;text-align:center;">
              <h1 style="margin:0;font-size:20px;font-weight:800;color:#ffffff;line-height:1.25;letter-spacing:-0.02em;">{{bannerHeadline}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 32px 28px;background-color:#ffffff;">
              {{bodyHtml}}
            </td>
          </tr>
          <tr>
            <td style="background-color:#e63946;padding:22px 28px;text-align:center;">
              <p style="margin:0 0 14px 0;font-size:14px;color:rgba(255,255,255,0.92);line-height:1.5;">Découvrir la plateforme</p>
              <a href="{{siteUrl}}" style="display:inline-block;padding:12px 28px;background-color:#ff6a00;color:#ffffff;text-decoration:none;border-radius:10px;font-size:14px;font-weight:800;">Ouvrir MangAfriq</a>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 28px;text-align:center;background-color:#ffffff;border-top:1px solid #e2e8f0;">
              <p style="margin:0 0 8px 0;font-size:12px;color:#64748b;line-height:1.5;">Vous recevez cet email au sujet de votre compte MangAfriq.</p>
              <p style="margin:0;font-size:12px;color:#94a3b8;">© {{year}} MangAfriq — Tous droits réservés</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
