services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=mangafriq
      - POSTGRES_USER=mangafriq
      - POSTGRES_PASSWORD=mangafriq
    ports:
      - '5432:5432'
    volumes:
      - mangafriq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangafriq -d mangafriq"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: 'rabbitmq:3-management'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    command: >
      bash -lc "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - '5672:5672'
      - '61613:61613'
      - '15672:15672'

volumes:
  mangafriq_pg:
